spring.application.name=virtual-wardrobe
server.port=${PORT:8080}
app.mode=${APP_MODE:api}
app.adapter-mode=${APP_ADAPTER_MODE:local}
app.image-provider=${APP_IMAGE_PROVIDER:mock}
app.local-data-directory=${APP_LOCAL_DATA_DIRECTORY:work/local-data}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/virtualwardrobe}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:virtualwardrobe}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
server.servlet.session.cookie.name=__session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never

app.ai.project=${APP_AI_PROJECT:}
app.ai.location=${APP_AI_LOCATION:global}
app.ai.model=${APP_AI_MODEL:gemini-nano-banana-2.1}
app.ai.timeout-seconds=${APP_AI_TIMEOUT_SECONDS:120}

spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h
app.environment=${APP_ENVIRONMENT:local}
app.captcha.mode=${APP_CAPTCHA_MODE:local}
app.captcha.site-key=${APP_RECAPTCHA_SITE_KEY:}
app.captcha.expected-action=${APP_RECAPTCHA_EXPECTED_ACTION:signup}
app.captcha.allowed-hostnames=${APP_RECAPTCHA_ALLOWED_HOSTNAMES:}
app.captcha.min-score=${APP_RECAPTCHA_MIN_SCORE:0.5}
app.bootstrap.email=${APP_BOOTSTRAP_SUPERADMIN_EMAIL:}
app.bootstrap.password=${APP_BOOTSTRAP_SUPERADMIN_PASSWORD:}
