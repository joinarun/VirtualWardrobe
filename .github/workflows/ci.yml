name: Application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtual-try-on
    steps:
      - uses: actions/checkout@v4
      - run: make bootstrap
      - run: make dev
      - run: make test lint build e2e
      - if: always()
        run: docker compose logs --no-color --tail=150
      - if: always()
        run: make down
